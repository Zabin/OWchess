{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h2>{{ player_name }} — deploy your King</h2>
  <p style="color:var(--muted); font-size:.85rem;">Pick a mission set. It fixes your King's starting regime and constrains which asset types you may deploy later.</p>
  <div class="section-actions">
    {% for ms in mission_sets %}
    <form method="post" action="/king-deploy" class="inline">
      <input type="hidden" name="player" value="{{ player_id }}">
      <input type="hidden" name="missionSet" value="{{ ms.mission_set_id }}">
      <input type="hidden" name="regime" value="{{ ms.king_regime_affinity[0] }}">
      <button type="submit" style="min-width:220px;">
        {{ ms.mission_set_id }} — King in {{ ms.king_regime_affinity[0] }}
      </button>
      <span style="color:var(--muted); font-size:.78rem;">assets: {{ ms.asset_type_ids | join(", ") }}</span>
    </form>
    {% endfor %}
  </div>
</div>
{% endblock %}
